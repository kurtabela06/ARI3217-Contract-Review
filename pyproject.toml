[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-review"
version = "0.1.0"
description = "ARI3217 contract clause review assistant"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "networkx",
    "rdflib",
    "pyshacl",
    "matplotlib",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "kagglehub",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
contract-train = "contract_review.train:main"
